plugins {
    alias(libs.plugins.spring.boot)
    alias(libs.plugins.spring.dependency.management)
    id 'java'
}

dependencies {
    implementation project(':libs:ucp-contract')
    implementation project(':libs:payment-handler-contract')
    implementation project(':libs:internal-api-contract')
    implementation libs.spring.boot.starter.web
    implementation libs.spring.boot.starter.actuator
    implementation libs.spring.boot.starter.jdbc
    implementation libs.spring.boot.flyway
    implementation libs.flyway.core
    implementation libs.nimbus.jose.jwt
    implementation libs.json.canonicalization
    // 검색어 정제용 형태소 분석기 nori(ADR 0013). 검색어 쪽에서만 돌리고 상품 색인에는 쓰지 않는다. 사전이 nori jar 안에 있다
    implementation libs.lucene.core
    implementation libs.lucene.analysis.common
    implementation libs.lucene.analysis.nori
    runtimeOnly libs.flyway.postgresql
    runtimeOnly libs.postgresql

    testImplementation libs.spring.boot.starter.test
    testImplementation project(':libs:test-support')
    // 마이그레이션과 리포지토리 SQL 을 진짜 PostgreSQL 에서 검증한다(Jira 294). pay-service 와 같은 구성.
    testImplementation 'io.zonky.test:embedded-postgres:2.2.2'
    testImplementation enforcedPlatform('io.zonky.test.postgres:embedded-postgres-binaries-bom:17.9.0')
}

tasks.named('test') {
    useJUnitPlatform { excludeTags 'postgres', 'parity' }
}

// 파이썬 벤치와 자바 검색이 같은 답을 내는지 전량 풀 100,262건에서 대조한다(ADR 0013). 30초쯤 걸리고 대조 자료
// docs/search-r7b-parity.json(4·5차, 525) 이 개인 문서라 CI 에는 없다. 그래서 기본 test 에서 빼고 따로 돈다.
tasks.register('parityTest', Test) {
    description = 'Compares the Java search against the Python bench dump on the full catalog pool.'
    group = 'verification'
    testClassesDirs = sourceSets.test.output.classesDirs
    classpath = sourceSets.test.runtimeClasspath
    useJUnitPlatform { includeTags 'parity' }
    shouldRunAfter tasks.named('test')
}

tasks.register('postgresTest', Test) {
    description = 'Runs migration and repository SQL tests against a disposable real PostgreSQL instance.'
    group = 'verification'
    testClassesDirs = sourceSets.test.output.classesDirs
    classpath = sourceSets.test.runtimeClasspath
    useJUnitPlatform { includeTags 'postgres' }
    shouldRunAfter tasks.named('test')
}
