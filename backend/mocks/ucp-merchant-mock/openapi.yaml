openapi: 3.1.0
info:
  title: UCP Merchant Mock
  version: "2026-08-25"
  description: |
    플랫폼 바깥 쇼핑몰(UCP Business)을 흉내 내는 목 서버의 HTTP 계약이다.
    Core 가 UCP REST 로 부르는 10개와 시연자가 치는 내부 스위치 2개를 담는다.

    컨테이너 하나가 가상 몰 셋을 서빙하고 경로의 `{merchantId}` 가 어느 몰인지 말한다.
    모르는 몰은 `404 MERCHANT_NOT_FOUND` 다.

    옛 경로 `/.well-known/ucp` 와 `/ucp/v1/**` 는 `merchant-a` 의 별칭으로 살아 있다.
    같은 컨트롤러로 forward 되므로 여기에는 따로 적지 않는다.

    인증은 없다. 시연용 목이고 Core 는 컨테이너 이름으로 직접 부른다.
    `/internal/` 은 Nginx 가 막아 Docker 내부망에서만 닿는다.

    모든 응답에 `X-Request-Id` 헤더가 붙는다. 요청에 있으면 그 값을, 없으면 새로 만든 값을 돌려준다.

    이 파일은 컨트롤러와 같은 경로·메서드 집합이어야 한다. `OpenApiContractTest` 가 대조한다.
servers:
  - url: http://ucp-merchant-mock:8080
    description: compose 내부망
  - url: http://localhost:8080
    description: 호스트에서 bootRun
tags:
  - name: profile
  - name: catalog
  - name: checkout
  - name: order
  - name: scenario
    description: 시연용 고장 스위치. 서비스 간 계약이 아니다

paths:
  /api/ucp/v1/{merchantId}/.well-known/ucp:
    get:
      tags: [profile]
      operationId: getBusinessProfile
      summary: Business Profile
      description: |
        지원 서비스·capability·payment handler 와 서명 검증용 공개키를 광고한다.
        `keys[]` 의 공개키로 체크아웃의 `merchant_authorization` 과 주문 웹훅 서명을 검증한다.
        개인키가 설정되지 않은 로컬 기동은 기동 때 임시 키 쌍을 만들어 그 공개 절반을 싣는다.
      parameters:
        - $ref: '#/components/parameters/MerchantId'
      responses:
        '200':
          description: Profile
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BusinessProfile'
        '404':
          $ref: '#/components/responses/Error'

  /api/ucp/v1/{merchantId}/catalog/search:
    post:
      tags: [catalog]
      operationId: searchCatalog
      summary: 상품 검색
      description: 결과가 없으면 빈 배열이고 404 를 내지 않는다. 최대 100건이다.
      parameters:
        - $ref: '#/components/parameters/MerchantId'
      requestBody:
        required: false
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/SearchRequest'
            example:
              query: 러닝화
              filters: { maxPrice: 100000, currency: KRW }
      responses:
        '200':
          $ref: '#/components/responses/Items'
        '404':
          $ref: '#/components/responses/Error'

  /api/ucp/v1/{merchantId}/catalog/lookup:
    post:
      tags: [catalog]
      operationId: lookupCatalog
      summary: 상품 일괄 조회
      description: 없는 id 는 결과에서 빠진다. 404 를 내지 않는다.
      parameters:
        - $ref: '#/components/parameters/MerchantId'
      requestBody:
        required: false
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/LookupRequest'
      responses:
        '200':
          $ref: '#/components/responses/Items'
        '404':
          $ref: '#/components/responses/Error'

  /api/ucp/v1/{merchantId}/catalog/product:
    post:
      tags: [catalog]
      operationId: getProduct
      summary: 상품 상세
      description: 구매 가능한 옵션만 싣는다. `productId` 가 비었거나 없으면 `404 PRODUCT_NOT_FOUND` 다. 옵션의 `optionValueId` 를 체크아웃의 `option_value_ids` 에 넣는다.
      parameters:
        - $ref: '#/components/parameters/MerchantId'
      requestBody:
        required: false
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ProductRequest'
      responses:
        '200':
          description: 상품 상세
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ProductDetail'
        '404':
          $ref: '#/components/responses/Error'

  /api/ucp/v1/{merchantId}/catalog/related:
    post:
      tags: [catalog]
      operationId: relatedProducts
      summary: 연관 상품(벤더 확장 com.copenhagen.catalog.related)
      description: |
        상품 id 를 받아 비슷한 상품(대체재)을 준다. 사용자 식별자는 받지 않는다 — 개인화는 부르는 쪽이 구매이력의 상품 id 를 넣어 조립한다.
        여러 id 면 앞쪽부터 번갈아 꺼낸다. 없는 id 는 조용히 빠지고, 품절·단종 상품은 추천하지 않는다. DESIGN.md 6.8절, ADR 0014.
        **기본은 꺼짐이다**(`merchant.catalog.related.enabled=false`). 꺼져 있으면 이 경로가 없다(404). Profile 에 광고하지 않는다.
      parameters:
        - $ref: '#/components/parameters/MerchantId'
      requestBody:
        required: false
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RelatedRequest'
            example:
              productIds: [kurly:5044571]
              limit: 4
      responses:
        '200':
          $ref: '#/components/responses/Items'
        '400':
          $ref: '#/components/responses/Error'
        '404':
          $ref: '#/components/responses/Error'
        '503':
          $ref: '#/components/responses/Error'

  /api/ucp/v1/{merchantId}/checkout-sessions:
    post:
      tags: [checkout]
      operationId: createCheckout
      summary: 체크아웃 생성
      description: |
        상품이 없거나 단종이면 `404 PRODUCT_NOT_FOUND` 이고 체크아웃이 만들어지지 않는다.
        그 밖의 부족함(배송지·옵션·재고·`purchase_request_id`)은 `201` 에 `status: incomplete` 와
        `messages[]` 로 알린다. 조건이 다 차면 `ready_for_complete` 와 `merchant_authorization` 이 실린다.
      parameters:
        - $ref: '#/components/parameters/MerchantId'
        - name: Idempotency-Key
          in: header
          required: false
          description: 받지만 쓰지 않는다
          schema: { type: string }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CheckoutRequest'
      responses:
        '201':
          $ref: '#/components/responses/Checkout'
        '404':
          $ref: '#/components/responses/Error'

  /api/ucp/v1/{merchantId}/checkout-sessions/{checkoutId}:
    get:
      tags: [checkout]
      operationId: getCheckout
      summary: 체크아웃 조회
      description: |
        `completed` 면 Complete 응답의 `order`·`payment` 를 함께 싣는다. Complete 응답을 놓친 Core 가
        재결제 대신 이 경로로 주문 id 를 확인한다. `complete_in_progress` 면 `payment.status` 만 싣는다.
      parameters:
        - $ref: '#/components/parameters/MerchantId'
        - $ref: '#/components/parameters/CheckoutId'
      responses:
        '200':
          $ref: '#/components/responses/Checkout'
        '404':
          $ref: '#/components/responses/Error'
    put:
      tags: [checkout]
      operationId: updateCheckout
      summary: 체크아웃 수정
      description: |
        전체 교체다. 생성 때 보낸 필드도 다시 실어야 한다. 직전 스냅샷과 단가가 달라지면
        `CHECKOUT_PRICE_CHANGED` 가 warning 으로 붙고 상태는 막지 않는다.
        `complete_in_progress`·`completed`·`canceled` 는 `409 CHECKOUT_NOT_MODIFIABLE` 이다.
      parameters:
        - $ref: '#/components/parameters/MerchantId'
        - $ref: '#/components/parameters/CheckoutId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CheckoutRequest'
      responses:
        '200':
          $ref: '#/components/responses/Checkout'
        '404':
          $ref: '#/components/responses/Error'
        '409':
          $ref: '#/components/responses/Error'

  /api/ucp/v1/{merchantId}/checkout-sessions/{checkoutId}/cancel:
    post:
      tags: [checkout]
      operationId: cancelCheckout
      summary: 체크아웃 취소
      description: |
        본문이 없다. 이미 `canceled` 면 같은 응답을 200 으로 재생한다.
        `complete_in_progress`·`completed` 는 `409 CHECKOUT_NOT_MODIFIABLE` 이다.
      parameters:
        - $ref: '#/components/parameters/MerchantId'
        - $ref: '#/components/parameters/CheckoutId'
      responses:
        '200':
          description: 취소됨
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CancelResult'
        '404':
          $ref: '#/components/responses/Error'
        '409':
          $ref: '#/components/responses/Error'

  /api/ucp/v1/{merchantId}/checkout-sessions/{checkoutId}/complete:
    post:
      tags: [checkout]
      operationId: completeCheckout
      summary: 체크아웃 완료
      description: |
        Pay 에 한 번 청구하고 성공하면 주문을 만든다. 결제 결과 세 갈래가 모두 200 이고 `status` 가 갈래를 말한다.

        - Pay SUCCESS → `completed`, `order` 가 실린다
        - Pay FAILED → `ready_for_complete` 로 되돌아간다. 새 Credential 로 다시 부를 수 있다
        - Pay UNKNOWN → `complete_in_progress`. 재조회 워커가 확정한다. 다시 청구하지 않는다

        이미 `completed` 면 저장된 응답을 그대로 재생하고 Pay 를 부르지 않는다.
        `Idempotency-Key` 는 받지만 쓰지 않는다. 체크아웃 id 가 곧 멱등 키다.
      parameters:
        - $ref: '#/components/parameters/MerchantId'
        - $ref: '#/components/parameters/CheckoutId'
        - name: Idempotency-Key
          in: header
          required: false
          description: 받지만 쓰지 않는다
          schema: { type: string }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CompleteRequest'
      responses:
        '200':
          description: 완료 결과
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CompleteResult'
        '400':
          $ref: '#/components/responses/Error'
        '404':
          $ref: '#/components/responses/Error'
        '409':
          $ref: '#/components/responses/Error'

  /api/ucp/v1/{merchantId}/orders/{orderId}:
    get:
      tags: [order]
      operationId: getOrder
      summary: 주문 조회
      description: 주문은 Complete 안에서만 생긴다. 생성 엔드포인트는 없다.
      parameters:
        - $ref: '#/components/parameters/MerchantId'
        - name: orderId
          in: path
          required: true
          schema: { type: string }
      responses:
        '200':
          description: 주문
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Order'
        '404':
          $ref: '#/components/responses/Error'

  /internal/v1/scenarios:
    get:
      tags: [scenario]
      operationId: getScenario
      summary: 지금 켜진 시나리오
      responses:
        '200':
          $ref: '#/components/responses/Scenario'
    post:
      tags: [scenario]
      operationId: setScenario
      summary: 시나리오 바꾸기
      description: 전역 하나다. `NORMAL` 이 초기화다. 재기동하면 `NORMAL` 로 돌아온다.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [scenario]
              properties:
                scenario:
                  $ref: '#/components/schemas/ScenarioName'
      responses:
        '200':
          $ref: '#/components/responses/Scenario'
        '400':
          $ref: '#/components/responses/Error'

webhooks:
  orderEvent:
    post:
      summary: 주문 웹훅 (이 모듈이 Core 로 보낸다)
      description: |
        주문이 생기면 `order.created` 를 보낸다. 받는 주소는 Core Platform Profile 의 webhook_url 이고,
        없으면 `CORE_WEBHOOK_URL`(기본 `{CORE_SERVICE_URL}/webhooks/v1/ucp/orders`)이다.
        RFC 9421 로 서명한다. 서명 대상은 `"@method" "@authority" "@path" "content-digest" "content-type"`
        다섯이고 키는 Business Profile `keys[]` 의 것이다.
        2xx 가 아니면 10초부터 두 배씩 늘려 최대 8번 다시 보낸다. 같은 사건은 같은 `Webhook-Id` 로 간다.
      parameters:
        - { name: Webhook-Id, in: header, required: true, schema: { type: string } }
        - { name: Webhook-Timestamp, in: header, required: true, schema: { type: string, format: date-time } }
        - { name: Content-Digest, in: header, required: true, schema: { type: string }, example: 'sha-256=:...:' }
        - { name: Signature-Input, in: header, required: true, schema: { type: string } }
        - { name: Signature, in: header, required: true, schema: { type: string } }
        - { name: UCP-Agent, in: header, required: true, schema: { type: string } }
        - { name: X-Request-Id, in: header, required: true, schema: { type: string } }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/OrderWebhook'
      responses:
        '2XX':
          description: 받음. 본문은 보지 않는다

components:
  parameters:
    MerchantId:
      name: merchantId
      in: path
      required: true
      description: 몰 id. `application.yml` 의 `merchant.malls[].id`
      schema:
        type: string
        enum: [merchant-a, merchant-b, merchant-c]
    CheckoutId:
      name: checkoutId
      in: path
      required: true
      schema: { type: string, format: uuid }

  responses:
    Error:
      description: 오류. 네 키가 항상 있고 값이 없으면 null 이다
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
          example:
            errorCode: ORDER_NOT_FOUND
            message: '주문을 찾을 수 없다: nope'
            currentState: null
            nextAction: CHECK_PURCHASE_STATUS
    Items:
      description: 상품 목록
      content:
        application/json:
          schema:
            type: object
            required: [items]
            properties:
              items:
                type: array
                items:
                  $ref: '#/components/schemas/Item'
    Checkout:
      description: 체크아웃 스냅샷
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Checkout'
    Scenario:
      description: 지금 값
      content:
        application/json:
          schema:
            type: object
            required: [scenario]
            properties:
              scenario:
                $ref: '#/components/schemas/ScenarioName'

  schemas:
    Error:
      type: object
      required: [errorCode, message, currentState, nextAction]
      properties:
        errorCode:
          type: string
          enum:
            - INVALID_REQUEST
            - MERCHANT_NOT_FOUND
            - PRODUCT_NOT_FOUND
            - CHECKOUT_NOT_FOUND
            - ORDER_NOT_FOUND
            - CHECKOUT_NOT_MODIFIABLE
            - CHECKOUT_INCOMPLETE
            - CHECKOUT_EXPIRED
          description: |
            400 INVALID_REQUEST — Complete 의 credentialId 누락·길이 초과, 모르는 시나리오 이름
            404 *_NOT_FOUND — 경로의 몰·상품·체크아웃·주문이 없다. 다른 몰의 체크아웃도 여기다
            409 CHECKOUT_NOT_MODIFIABLE — 결제가 시작됐거나 끝났거나 취소된 체크아웃을 바꾸려 했다
            409 CHECKOUT_INCOMPLETE — incomplete·requires_escalation 에 Complete. currentState 로 구별한다
            409 CHECKOUT_EXPIRED — expires_at 이 지난 뒤 Complete
        message: { type: string }
        currentState: { type: [string, 'null'], description: 오류 시점의 체크아웃 상태 }
        nextAction:
          type: [string, 'null']
          enum: [RETURN_TO_CART, CHECK_PURCHASE_STATUS, UPDATE_CHECKOUT_INPUT, RESTART_CHECKOUT, null]

    BusinessProfile:
      type: object
      required: [ucp, keys]
      properties:
        ucp:
          type: object
          properties:
            version: { type: string, example: '2026-08-25' }
            services:
              type: object
              description: '서비스 이름 → 목록. 지금은 dev.ucp.shopping 하나'
              additionalProperties:
                type: array
                items:
                  type: object
                  properties:
                    version: { type: string }
                    transport: { type: string, example: rest }
                    endpoint: { type: string, example: 'http://ucp-merchant-mock:8080/api/ucp/v1/merchant-a' }
            capabilities:
              type: object
              description: 'capability 이름 → 목록. catalog.search·catalog.lookup·checkout·order·fulfillment. AP2-like 는 설정으로 켠다'
              additionalProperties:
                type: array
                items:
                  type: object
                  properties:
                    version: { type: string }
            payment_handlers:
              type: object
              description: 'namespace → 목록. com.copenhagen.pay'
              additionalProperties:
                type: array
                items:
                  type: object
                  properties:
                    id: { type: string, example: copenhagen-pay-handler }
                    version: { type: string, example: '1' }
        keys:
          type: array
          description: ES256 공개 JWK
          items:
            type: object
            properties:
              kty: { type: string, example: EC }
              use: { type: string, example: sig }
              crv: { type: string, example: P-256 }
              kid: { type: string, example: merchant-a-es256-1 }
              x: { type: string }
              y: { type: string }
              alg: { type: string, example: ES256 }

    SearchRequest:
      type: object
      properties:
        query: { type: string, description: 비우면 전량에서 앞부터 }
        filters:
          type: object
          properties:
            maxPrice: { type: integer, format: int64 }
            currency: { type: string, example: KRW }
    LookupRequest:
      type: object
      properties:
        productIds:
          type: array
          items: { type: string }
    ProductRequest:
      type: object
      required: [productId]
      properties:
        productId: { type: string }
    RelatedRequest:
      type: object
      properties:
        productIds:
          type: array
          maxItems: 20
          items: { type: string }
        limit: { type: integer, minimum: 1, maximum: 20, default: 4 }
    Price:
      type: object
      required: [amount, currency]
      properties:
        amount: { type: integer, format: int64, description: 원 단위 }
        currency: { type: string, example: KRW }
    Availability:
      type: string
      enum: [IN_STOCK, OUT_OF_STOCK]
    Item:
      type: object
      required: [productId, title, price, availability]
      properties:
        productId: { type: string, example: 'daiso:048008872' }
        title: { type: string }
        imageUrl: { type: string, description: 없으면 키가 빠진다 }
        price: { $ref: '#/components/schemas/Price' }
        availability: { $ref: '#/components/schemas/Availability' }
    ProductDetail:
      type: object
      required: [productId, title, price, options, availability]
      properties:
        productId: { type: string }
        title: { type: string }
        imageUrl: { type: string }
        description: { type: string }
        price: { $ref: '#/components/schemas/Price' }
        options:
          type: array
          items:
            type: object
            properties:
              name: { type: string, example: 사이즈 }
              values:
                type: array
                items:
                  type: object
                  properties:
                    optionValueId: { type: string, description: SKU. 체크아웃의 option_value_ids 에 넣는다 }
                    label: { type: string }
                    priceAmount: { type: integer, format: int64, description: 기본가 + 옵션 추가금 }
                    stockQuantity: { type: integer }
        availability: { $ref: '#/components/schemas/Availability' }

    CheckoutRequest:
      type: object
      properties:
        line_items:
          type: array
          items:
            type: object
            properties:
              product_id: { type: string }
              option_value_ids:
                type: array
                items: { type: string }
              quantity: { type: integer, minimum: 1 }
        fulfillment:
          type: object
          properties:
            type: { type: string, example: shipping }
            destination:
              type: object
              properties:
                recipient: { type: string }
                postal_code: { type: string, description: '도서산간·제주 추가금 판정에 쓴다' }
                address_line1: { type: string }
                address_line2: { type: string }
        purchase_request_id:
          type: string
          description: 'Core 의 PurchaseRequest id. 서명 claim 이라 없으면 incomplete 다. PUT 에도 실어야 한다'
      example:
        line_items:
          - { product_id: 'daiso:048008872', option_value_ids: ['daiso:048008872-default'], quantity: 1 }
        purchase_request_id: pr-sample-1
        fulfillment:
          type: shipping
          destination: { recipient: 홍길동, postal_code: '06236', address_line1: 서울 강남구 테헤란로 212 }
    CheckoutStatus:
      type: string
      enum: [incomplete, requires_escalation, ready_for_complete, complete_in_progress, completed, canceled]
    Checkout:
      type: object
      required: [id, status, currency, line_items, totals]
      description: 값이 없는 필드는 키가 빠진다
      properties:
        id: { type: string, format: uuid }
        status: { $ref: '#/components/schemas/CheckoutStatus' }
        currency: { type: string, example: KRW }
        line_items:
          type: array
          items:
            type: object
            properties:
              id: { type: string, example: line-1 }
              item:
                type: object
                properties:
                  id: { type: string }
                  title: { type: string }
                  price: { type: integer, format: int64, description: 옵션 추가금을 더한 단가 }
              quantity: { type: integer }
        fulfillment:
          type: object
          properties:
            type: { type: string, example: shipping }
            status: { type: string, enum: [available, unavailable] }
            amount: { type: integer, format: int64, description: 'unavailable 이면 없다' }
        totals:
          type: array
          description: 'subtotal·fulfillment·total. 배송지가 없으면 fulfillment 줄이 없다'
          items:
            type: object
            properties:
              type: { type: string, enum: [subtotal, fulfillment, total] }
              amount: { type: integer, format: int64 }
        messages:
          type: array
          description: 'severity error 가 하나라도 있으면 ready_for_complete 로 못 간다'
          items:
            $ref: '#/components/schemas/Message'
        expires_at: { type: string, format: date-time, description: 'ready_for_complete 가 된 시각 + 5분' }
        merchant_authorization:
          type: string
          description: 'ES256 Compact JWS. ready_for_complete 일 때만 있다. Core 가 Pay checkoutJwt 에 그대로 넣는다'
        order: { $ref: '#/components/schemas/OrderRef' }
        payment: { $ref: '#/components/schemas/PaymentRef' }
    Message:
      type: object
      properties:
        code:
          type: string
          enum:
            - ADDRESS_REQUIRED
            - CHECKOUT_INCOMPLETE
            - CHECKOUT_STOCK_INSUFFICIENT
            - ADDRESS_NOT_SERVICEABLE
            - MERCHANT_HANDOFF_REQUIRED
            - CHECKOUT_PRICE_CHANGED
            - CHECKOUT_REMOTE_AREA_SURCHARGE
        severity: { type: string, enum: [error, warning] }
        message: { type: string }
        target: { type: string, example: fulfillment.destination }
    CancelResult:
      type: object
      required: [id, status]
      properties:
        id: { type: string }
        status: { type: string, const: canceled }
    CompleteRequest:
      type: object
      required: [payment]
      properties:
        payment:
          type: object
          properties:
            instrument:
              type: object
              properties:
                credential:
                  type: object
                  required: [credentialId]
                  properties:
                    credentialId: { type: string, description: 'Pay 가 발급한 Payment Credential. 없으면 400' }
    CompleteResult:
      type: object
      required: [id, status, payment]
      properties:
        id: { type: string }
        status: { type: string, enum: [completed, ready_for_complete, complete_in_progress] }
        order: { $ref: '#/components/schemas/OrderRef' }
        payment: { $ref: '#/components/schemas/PaymentRef' }
    OrderRef:
      type: object
      properties:
        id: { type: string }
        permalink_url: { type: string }
    PaymentRef:
      type: object
      properties:
        paymentId: { type: string }
        status: { type: string, enum: [PROCESSING, SUCCESS, FAILED, UNKNOWN] }
        errorCode: { type: string, description: 'FAILED 일 때 Pay 가 준 사유. 예 PG_DECLINED' }
    Order:
      type: object
      required: [id, checkout_id, status, fulfillment, updated_at]
      properties:
        id: { type: string }
        checkout_id: { type: string }
        status:
          type: string
          enum: [CREATED, CONFIRMED, SHIPPED, DELIVERED, CANCELED]
          description: 지금 코드가 만드는 값은 CREATED 하나다. 나머지로 옮기는 경로는 없다
        fulfillment:
          type: object
          properties:
            status: { type: string, description: status 와 같은 값 }
        updated_at: { type: string, format: date-time }
    OrderWebhook:
      type: object
      required: [merchant_id, order]
      properties:
        merchant_id: { type: string, example: merchant-a }
        order: { $ref: '#/components/schemas/Order' }
    ScenarioName:
      type: string
      enum:
        - NORMAL
        - PRICE_CHANGED
        - OUT_OF_STOCK
        - ADDRESS_NOT_SERVICEABLE
        - REQUIRES_ESCALATION
        - INVALID_MERCHANT_SIGNATURE
        - COMPLETE_TIMEOUT_BEFORE_PROCESS
        - COMPLETE_TIMEOUT_AFTER_ORDER
        - WEBHOOK_DUPLICATE
        - WEBHOOK_DELAYED
