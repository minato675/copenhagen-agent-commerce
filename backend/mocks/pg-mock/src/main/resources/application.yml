spring:
  application:
    name: pg-mock

pg:
  mock:
    outcome: ${PG_MOCK_OUTCOME:SUCCESS}
    response-delay-millis: ${PG_MOCK_RESPONSE_DELAY_MILLIS:0}
    lookup-outcome: ${PG_MOCK_LOOKUP_OUTCOME:UNKNOWN}

management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      probes:
        enabled: true
