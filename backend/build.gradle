plugins {
    id 'base'
    alias(libs.plugins.spring.boot) apply false
    alias(libs.plugins.spring.dependency.management) apply false
}

allprojects {
    group = 'com.copenhagen'
    version = '0.1.0-SNAPSHOT'
}

subprojects {
    apply plugin: 'checkstyle'

    checkstyle {
        toolVersion = '13.9.0'
        configDirectory = rootProject.layout.projectDirectory.dir('config/checkstyle')
        maxWarnings = 0
    }

    plugins.withType(JavaPlugin).configureEach {
        java {
            toolchain {
                languageVersion = JavaLanguageVersion.of(21)
            }
        }

        tasks.withType(JavaCompile).configureEach {
            options.encoding = 'UTF-8'
            options.release = 21
        }

        tasks.withType(org.gradle.api.plugins.quality.Checkstyle).configureEach {
            reports {
                xml.required = true
                html.required = true
            }
        }

        tasks.withType(Test).configureEach {
            useJUnitPlatform()
        }
    }

    plugins.withId('org.springframework.boot') {
        tasks.matching { it.name == 'bootJar' }.configureEach {
            archiveFileName = 'app.jar'
        }
        tasks.matching { it.name == 'jar' }.configureEach {
            enabled = false
        }
    }

    tasks.matching { it.name == 'build' }.configureEach { subprojectBuildTask ->
        rootProject.tasks.named('build').configure {
            dependsOn(subprojectBuildTask)
        }
    }
}
