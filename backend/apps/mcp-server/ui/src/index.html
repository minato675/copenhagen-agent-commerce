<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>Copenhagen</title>
  <style>
    /* FONTS */
    * { box-sizing: border-box; }
    html, body { margin: 0; padding: 0; background: #f4f4f4; color: #161616; }
    #app, #app button { font-family: 'IBM Plex Sans KR', sans-serif; font-weight: 400; }
    #app { width: 100%; padding: 20px; }
    header { display: flex; align-items: center; min-height: 42px; padding-bottom: 18px; border-bottom: 1px solid #c6c6c6; }
    .logo { display: block; width: 196px; max-width: 80%; height: auto; }
    .connection { padding: 24px 0; }
    .label { margin: 0 0 10px; color: #525252; font-size: 12px; }
    #status { display: flex; align-items: center; gap: 10px; min-height: 32px; margin: 0; font-size: 22px; font-weight: 600; line-height: 1.5; overflow-wrap: anywhere; }
    #status::before { content: ''; flex: 0 0 8px; height: 8px; border-radius: 50%; background: #8d8d8d; }
    #status[data-state='connected']::before { background: #198038; }
    #status[data-state='error']::before { background: #da1e28; }
    #status[data-state='pending']::before { background: #0f62fe; }
    button { display: flex; justify-content: space-between; align-items: center; width: 100%; min-height: 48px; border: 0; border-radius: 0; padding: 12px 16px; background: #0f62fe; color: white; font-size: 14px; cursor: pointer; touch-action: manipulation; }
    button::after { content: '↻'; font: 22px sans-serif; }
    button:hover:not(:disabled) { background: #0353e9; }
    button:focus-visible { outline: 2px solid #161616; outline-offset: 3px; }
    button:disabled { background: #c6c6c6; color: #525252; cursor: wait; }
    footer { display: flex; justify-content: space-between; gap: 8px; margin-top: 16px; color: #525252; font-size: 11px; font-variant-numeric: tabular-nums; }
    @media (max-width: 340px) { #app { padding: 16px; } #status { font-size: 19px; } }
  </style>
</head>
<body>
  <main id="app">
    <header><img class="logo" src="__LOGO__" alt="COPENHAGEN"></header>
    <section class="connection" aria-label="MCP 연결">
      <p class="label">MCP</p>
      <h1 id="status" role="status" aria-live="polite">연결 중</h1>
    </section>
    <button id="check" type="button" disabled>연결 중…</button>
    <footer><time id="checked-at" aria-label="서버 확인 시간">—</time><span>QA1 · <span id="version">—</span></span></footer>
  </main>
  <script>/* SCRIPT */</script>
</body>
</html>
