# ChatGPT 계정 연결을 먼저 검증한다. Core 업무 API와 App Link는 사용하지 않는다.
mcp:
  integration:
    enabled: false
  auth:
    resource: ${MCP_AUTH_RESOURCE:https://j15a207.p.ssafy.io/mcp}
    required-scopes: catalog:read
    jwt:
      enabled: true
  ui:
    enabled: true
  catalog:
    enabled: false
    detail-enabled: false
  cart:
    enabled: false
  handoff:
    enabled: false
  merchants:
    enabled: false
  server:
    allowed-hosts: ${MCP_ALLOWED_HOSTS:j15a207.p.ssafy.io,mcp-server:8080,localhost:8080}
    allowed-origins: ${MCP_ALLOWED_ORIGINS:https://chatgpt.com}

services:
  core:
    auth:
      enabled: false
