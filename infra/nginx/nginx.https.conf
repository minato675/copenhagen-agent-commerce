events {}

http {
  server_tokens off;

  # Docker DNS를 재조회하여 서비스 교체·중단 중에도 nginx를 reload할 수 있습니다.
  resolver 127.0.0.11 valid=10s ipv6=off;
  resolver_timeout 5s;

  upstream core_service {
    zone core_service 64k;
    server core-service:8080 resolve;
  }

  upstream mcp_server {
    zone mcp_server 64k;
    server mcp-server:8080 resolve;
  }

  upstream pay_service {
    zone pay_service 64k;
    server pay-service:8080 resolve;
  }

  upstream pg_mock {
    zone pg_mock 64k;
    server pg-mock:8080 resolve;
  }

  server {
    listen 80;
    server_name j15a207.p.ssafy.io;

    location ^~ /.well-known/acme-challenge/ {
      root /var/www/certbot;
      default_type text/plain;
      try_files $uri =404;
    }

    location = /internal {
      return 404;
    }

    location ^~ /internal/ {
      return 404;
    }

    location / {
      return 308 https://j15a207.p.ssafy.io$request_uri;
    }
  }

  server {
    listen 443 ssl;
    server_name j15a207.p.ssafy.io;

    ssl_certificate /etc/letsencrypt/live/j15a207.p.ssafy.io/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/j15a207.p.ssafy.io/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_session_cache shared:TLS:10m;
    ssl_session_timeout 1d;

    location = /internal {
      return 404;
    }

    location ^~ /internal/ {
      return 404;
    }

    location = /.well-known/ucp {
      proxy_pass http://core_service;
      proxy_set_header Host $host;
      proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
      proxy_set_header X-Forwarded-Proto $scheme;
    }

    location = /webhooks/v1/ucp/orders {
      proxy_pass http://core_service;
      proxy_set_header Host $host;
      proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
      proxy_set_header X-Forwarded-Proto $scheme;
    }

    # OAuth discovery and authorization use distinct upstreams; keep other well-known paths closed.
    location = /.well-known/oauth-protected-resource {
      proxy_pass http://mcp_server;
      proxy_set_header Host $host;
      proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
      proxy_set_header X-Forwarded-Proto $scheme;
    }

    location = /.well-known/oauth-protected-resource/mcp {
      proxy_pass http://mcp_server;
      proxy_set_header Host $host;
      proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
      proxy_set_header X-Forwarded-Proto $scheme;
    }

    location = /.well-known/oauth-authorization-server {
      proxy_pass http://core_service;
      proxy_set_header Host $host;
      proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
      proxy_set_header X-Forwarded-Proto $scheme;
    }

    location = /.well-known/jwks.json {
      proxy_pass http://core_service;
      proxy_set_header Host $host;
      proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
      proxy_set_header X-Forwarded-Proto $scheme;
    }

    location = /oauth/authorize {
      proxy_pass http://core_service;
      proxy_set_header Host $host;
      proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
      proxy_set_header X-Forwarded-Proto $scheme;
    }

    location ^~ /oauth/authorize/ {
      proxy_pass http://core_service;
      proxy_set_header Host $host;
      proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
      proxy_set_header X-Forwarded-Proto $scheme;
    }

    location = /oauth/token {
      proxy_pass http://core_service;
      proxy_set_header Host $host;
      proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
      proxy_set_header X-Forwarded-Proto $scheme;
    }

    location /mcp {
      proxy_pass http://mcp_server;
      proxy_set_header Host $host;
      proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
      proxy_set_header X-Forwarded-Proto $scheme;
    }

    location /api/core/ {
      proxy_pass http://core_service;
      proxy_set_header Host $host;
      proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
      proxy_set_header X-Forwarded-Proto $scheme;
    }

    location /api/pay/ {
      proxy_pass http://pay_service;
      proxy_set_header Host $host;
      proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
      proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Development-only PG Mock APIs; preserve the /api/pg/ prefix upstream.
    location ^~ /api/pg/ {
      proxy_pass http://pg_mock;
      proxy_set_header Host $host;
      proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
      proxy_set_header X-Forwarded-Proto $scheme;
      proxy_set_header X-Request-Id $request_id;
    }

    location /merchant/v1/ {
      proxy_pass http://pay_service;
      proxy_set_header Host $host;
      proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
      proxy_set_header X-Forwarded-Proto $scheme;
    }

    location / {
      return 404;
    }
  }
}
